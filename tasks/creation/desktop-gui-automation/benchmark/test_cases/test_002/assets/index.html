<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halcyon Procedure Calendar</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#eef1f3;color:#17232b}header{height:60px;background:#30425d;color:white;padding:0 25px;display:flex;align-items:center;font-size:20px;font-weight:bold}main{padding:18px 28px}.card{background:white;border:1px solid #ccd5db;border-radius:5px;padding:15px}.calendar{display:grid;grid-template-columns:70px repeat(4,1fr);grid-template-rows:42px repeat(9,52px);position:relative;height:510px;user-select:none}.cell{border-right:1px solid #d8dfe3;border-bottom:1px solid #e1e6e9;padding:7px;color:#60717b}.day{text-align:center;font-weight:bold;background:#f4f7f8;color:#243640}.event{position:absolute;border-left:5px solid #4478a6;background:#dbeafa;padding:8px;font-weight:bold;border-radius:3px;z-index:2;cursor:grab;box-shadow:0 1px 2px #0002}.event.drag{opacity:.75;cursor:grabbing}.other{border-color:#7c6aa8;background:#eee9fa;cursor:default}.details{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.field{display:flex;flex-direction:column;gap:5px}select,input,textarea{padding:9px;border:1px solid #8d9da7;font:inherit}textarea{height:70px}button{border:0;padding:10px 15px;border-radius:4px;font-weight:bold}.primary{background:#176d78;color:white}.secondary{background:#e0e6e8}.modalwrap{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:5}.modalwrap.on{display:flex}.modal{width:470px;background:white;padding:22px;border-radius:5px}.warning{border-left:4px solid #c97c00;background:#fff4dc;padding:10px}.review{position:fixed;right:-500px;top:0;width:480px;height:100%;background:white;box-shadow:-7px 0 18px #0003;padding:24px;transition:.2s;z-index:4}.review.open{right:0}.summary div{padding:8px;border-bottom:1px solid #e4e8ea}.success{border-left:5px solid #19835d;background:#eaf7ef;padding:13px;margin:10px 0}.error{color:#b42318}
</style></head><body><header>Halcyon Procedure Calendar <span style="margin-left:auto;font-size:13px;font-weight:normal">Week of July 27</span></header><main><h1>Sterilization schedule</h1><div id="success"></div><section class="card"><div id="cal" class="calendar"></div><div class="details"><label class="field">Selected event room<select id="room"><option>Suite 1</option><option>Suite 2</option><option>Suite 3</option></select></label><label class="field">Owner<input value="Priya Shah" disabled></label><label class="field" style="grid-column:1/-1">Event note<textarea id="note"></textarea></label></div><p id="error" class="error"></p><button id="reviewBtn" class="primary">Review update</button></section></main><div id="mw" class="modalwrap"><div class="modal"><h2>Cleaning buffer conflict</h2><div class="warning">Suite 2 cleaning buffer runs until Thursday 14:45.</div><p>Choose how to resolve this recoverable conflict.</p><button id="adjust" class="primary">Start after buffer at 14:45</button> <button id="revert" class="secondary">Return to original time</button></div></div><aside id="review" class="review"><h1>Review event update</h1><p>No calendar change is finalized until confirmation.</p><div id="summary" class="summary"></div><p id="reviewError" class="error"></p><button id="back" class="secondary">Back</button> <button id="confirm" class="primary">Confirm update</button></aside>
<script>
const $=q=>document.querySelector(q),days=['Tuesday','Wednesday','Thursday','Friday'],S={title:'Sterilizer B validation',day:'Tuesday',start:'09:00',end:'10:30',duration:90,room:'Suite 1',owner:'Priya Shah',checklist:['Biological indicator','Seal integrity','Cycle export'],note:'',pendingDrop:null,conflictSeen:false,reviewed:false,confirmed:false,confirmCount:0,otherEvents:{'Hiring sync':{day:'Wednesday',start:'11:00'},'Media change':{day:'Friday',start:'13:00'}},trace:[],decisive:[]};const initialOthers=JSON.stringify(S.otherEvents);
function copy(){return JSON.parse(JSON.stringify({...S,trace:undefined,decisive:undefined,otherEventsPreserved:JSON.stringify(S.otherEvents)===initialOthers}))}function rec(a,t,v,o='ok',m=false){S.trace.push({sequence:S.trace.length+1,action:a,target:t,value:v,outcome:o});if(m)S.decisive.push({sequence:S.trace.length,state:copy()});fetch('/record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:copy(),trace:S.trace,decisive_snapshots:S.decisive})})}function mins(s){const[a,b]=s.split(':').map(Number);return (a-8)*60+b}function pos(day,time,dur){const cal=$('#cal'),cw=(cal.clientWidth-70)/4;return {left:70+days.indexOf(day)*cw+5,top:42+mins(time)/60*52+2,width:cw-10,height:dur/60*52-4}}
function build(){let h='<div class="cell day"></div>'+days.map(d=>`<div class="cell day">${d}<br><small>${d==='Tuesday'?'28':d==='Wednesday'?'29':d==='Thursday'?'30':'31'} Jul</small></div>`).join('');for(let r=0;r<9;r++){h+=`<div class="cell">${String(r+8).padStart(2,'0')}:00</div>`+days.map(()=>'<div class="cell"></div>').join('')}$('#cal').innerHTML=h;eventEl(S.title,S.day,S.start,S.duration,true);eventEl('Hiring sync','Wednesday','11:00',60,false);eventEl('Media change','Friday','13:00',60,false);document.documentElement.dataset.benchmarkReady='true'}function eventEl(title,day,start,dur,drag){const p=pos(day,start,dur),e=document.createElement('div');e.className='event '+(drag?'':'other');e.style.cssText=`left:${p.left}px;top:${p.top}px;width:${p.width}px;height:${p.height}px`;e.innerHTML=`${title}<br><small>${start} · ${drag?S.room:'Suite 3'}</small>`;$('#cal').append(e);if(drag)bindDrag(e)}
function bindDrag(e){let down=null,orig={};e.onpointerdown=x=>{down={x:x.clientX,y:x.clientY};orig={l:parseFloat(e.style.left),t:parseFloat(e.style.top)};e.setPointerCapture(x.pointerId);e.classList.add('drag');rec('pointer_down',S.title,{x:Math.round(x.clientX),y:Math.round(x.clientY)})};e.onpointermove=x=>{if(!down)return;e.style.left=orig.l+x.clientX-down.x+'px';e.style.top=orig.t+x.clientY-down.y+'px'};e.onpointerup=x=>{if(!down)return;const cal=$('#cal').getBoundingClientRect(),cx=x.clientX-cal.left,cy=x.clientY-cal.top,cw=(cal.width-70)/4,di=Math.max(0,Math.min(3,Math.floor((cx-70)/cw))),raw=8*60+Math.round(((cy-42)/52*60)/30)*30,time=String(Math.floor(raw/60)).padStart(2,'0')+':'+String(raw%60).padStart(2,'0'),day=days[di];down=null;e.classList.remove('drag');rec('drag_drop',S.title,{day,time,x:Math.round(cx),y:Math.round(cy)});if(day==='Thursday'&&time==='14:30'){S.pendingDrop={day,time};S.conflictSeen=true;$('#mw').classList.add('on');rec('modal','Cleaning buffer conflict',null,'shown')}else{$('#error').textContent='Drop the block at Thursday 14:30.';build()}}}
$('#adjust').onclick=()=>{S.day='Thursday';S.start='14:45';S.end='16:15';S.pendingDrop=null;$('#mw').classList.remove('on');$('#room').value='Suite 2';S.room='Suite 2';rec('click','Start after buffer at 14:45',null,'resolved');build()};$('#revert').onclick=()=>{S.pendingDrop=null;$('#mw').classList.remove('on');rec('click','Return to original time',null,'reverted');build()};$('#room').onchange=e=>{S.room=e.target.value;rec('select','Room',S.room)};$('#note').onchange=e=>{S.note=e.target.value;rec('input','Event note',S.note)};
$('#reviewBtn').onclick=()=>{S.note=$('#note').value;S.room=$('#room').value;if(!(S.conflictSeen&&S.day==='Thursday'&&S.start==='14:45'&&S.room==='Suite 2'&&S.note==='QA observer confirmed.')){$('#error').textContent='Resolve the Thursday conflict and complete room and note.';rec('click','Review update',null,'blocked');return}S.reviewed=true;$('#summary').innerHTML=`<div><b>${S.title}</b></div><div>Thursday · 14:45-16:15 · Suite 2</div><div>Owner: ${S.owner}</div><div>Checklist: ${S.checklist.join(', ')}</div><div>Note: ${S.note}</div>`;$('#review').classList.add('open');rec('open','Event review',null,'ok',true)};$('#back').onclick=()=>{$('#review').classList.remove('open');rec('close','Event review',null)};$('#confirm').onclick=()=>{if(!S.reviewed)return;S.confirmed=true;S.confirmCount++;$('#review').classList.remove('open');$('#success').className='success';$('#success').textContent='Sterilizer B validation updated: Thursday 14:45-16:15, Suite 2';rec('click','Confirm update',null,'committed',true);build()};build();rec('ready','Procedure calendar',null)
</script></body></html>
