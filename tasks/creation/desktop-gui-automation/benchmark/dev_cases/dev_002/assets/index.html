<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northline Dispatch Queue</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.4 Arial,sans-serif;color:#17222b;background:#eef2f4}header{height:62px;background:#193e55;color:white;padding:0 25px;display:flex;align-items:center;font-size:20px;font-weight:700}header span{margin-left:auto;font-size:13px;font-weight:400}main{padding:22px 28px}.toolbar,.bulkbar{display:flex;gap:12px;align-items:end;background:white;border:1px solid #d3dce1;padding:14px;margin-bottom:12px}.field{display:flex;flex-direction:column;gap:4px}select,input,textarea{padding:8px;border:1px solid #8fa0aa;border-radius:4px;font:inherit}.grow{flex:1}button{border:0;border-radius:4px;padding:9px 14px;font-weight:700}.primary{background:#08756b;color:white}.secondary{background:#dfe7ea}.danger{color:#a3261d}table{width:100%;border-collapse:collapse;background:white;border:1px solid #d3dce1;table-layout:fixed}th,td{text-align:left;padding:10px;border-bottom:1px solid #e3e8eb}th{background:#f7f9fa;color:#50616b}.id{font-weight:700;color:#185e86}.temp.hot{color:#b3261e;font-weight:700}.pager{display:flex;justify-content:space-between;align-items:center;background:white;padding:11px;border:1px solid #d3dce1;border-top:0}.drawer{position:fixed;top:0;right:-520px;width:500px;height:100%;background:white;box-shadow:-8px 0 20px #0003;padding:25px;transition:.2s;z-index:3;overflow:auto}.drawer.open{right:0}.drawer h2{margin-top:0}.reviewids{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#e7f2f0;padding:6px 9px;border-radius:3px}.overlay{position:fixed;inset:0;background:#0005;display:none}.overlay.on{display:block}.status{padding:7px 9px;border-radius:3px;background:#edf2f4}.success{border-left:4px solid #16865f;background:#e9f8ef;padding:12px;margin-bottom:12px}.note{height:90px}.muted{color:#63737d}
</style></head><body><header>Northline Dispatch <span>Exception operations</span></header><main><h1>Shipment exceptions</h1><div id="success"></div><div class="toolbar">
<label class="field">Region<select id="region"><option>All</option><option>West</option><option>Southeast</option></select></label><label class="field">Status<select id="status"><option>Open</option><option>All</option></select></label><label class="field">Exception<select id="type"><option>All</option><option>Cold chain</option><option>Documentation</option></select></label><label class="field">Minimum temperature<input id="temp" type="number" step="0.1" placeholder="Any"></label><button id="filter" class="primary">Apply filters</button><button id="clear" class="secondary">Clear selection</button><span id="sel" class="grow"></span><button id="bulk" class="primary">Review bulk action</button></div>
<table><thead><tr><th style="width:48px"></th><th>ID</th><th>Region</th><th>Exception</th><th>Temperature</th><th>Status</th><th>Owner</th><th>Follow-up</th></tr></thead><tbody id="rows"></tbody></table><div class="pager"><span id="pageInfo"></span><div><button id="prev" class="secondary">Previous</button> <button id="next" class="secondary">Next</button></div></div></main><div id="shade" class="overlay"></div><aside id="drawer" class="drawer"><h2>Review scoped action</h2><p class="muted">Confirm every selected shipment before applying.</p><div id="reviewIds" class="reviewids"></div><p><b id="reviewCount"></b></p><label class="field">Bulk action<select id="action"><option>Choose...</option><option>Route to specialist</option><option>Close exception</option></select></label><label class="field">Specialist<select id="specialist"><option>Choose...</option><option>Inez Park</option><option>Omar Diallo</option></select></label><label class="field">Follow-up date<input id="date" type="date"></label><label class="field">Internal note<textarea id="note" class="note"></textarea></label><p id="error" class="danger"></p><button id="cancel" class="secondary">Back to queue</button> <button id="apply" class="primary">Apply to selected</button></aside>
<script>
const base=[['NC-201','West','Cold chain',7.2],['NC-204','West','Cold chain',9.4],['NC-205','West','Cold chain',8.0],['NC-207','West','Documentation',null],['NC-210','West','Cold chain',6.8],['NC-212','West','Cold chain',7.9],['NC-219','West','Cold chain',10.1],['NC-220','West','Cold chain',8.0],['NC-223','West','Documentation',null],['NC-228','West','Cold chain',5.4],['NC-230','West','Cold chain',7.7],['NC-233','West','Cold chain',12.6],['SE-118','Southeast','Cold chain',11.2],['SE-121','Southeast','Documentation',null],['SE-124','Southeast','Cold chain',9.1]];const records=Object.fromEntries(base.map(x=>[x[0],{id:x[0],region:x[1],type:x[2],temperature:x[3],status:'Open',owner:null,followUp:null,note:null}]));const initial=JSON.parse(JSON.stringify(records));const S={filters:{region:'All',status:'Open',type:'All',minTemperature:null},page:0,pageSize:5,selected:['SE-118'],applyCount:0,records};const trace=[],decisive=[],$=q=>document.querySelector(q);
function state(){return {filters:S.filters,page:S.page,selected:[...S.selected],applyCount:S.applyCount,records:S.records,unrelatedPreserved:Object.keys(records).filter(id=>!['NC-204','NC-219','NC-233'].includes(id)).every(id=>JSON.stringify(records[id])===JSON.stringify(initial[id]))}}function rec(action,target,value,outcome='ok',mark=false){trace.push({sequence:trace.length+1,action,target,value,outcome,page:S.page+1});if(mark)decisive.push({sequence:trace.length,state:state()});fetch('/record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:state(),trace,decisive_snapshots:decisive})})}
function filtered(){return Object.values(records).filter(r=>(S.filters.region==='All'||r.region===S.filters.region)&&(S.filters.status==='All'||r.status===S.filters.status)&&(S.filters.type==='All'||r.type===S.filters.type)&&(S.filters.minTemperature==null||r.temperature>S.filters.minTemperature))}function render(){const f=filtered(),pages=Math.max(1,Math.ceil(f.length/S.pageSize));S.page=Math.min(S.page,pages-1);const slice=f.slice(S.page*S.pageSize,(S.page+1)*S.pageSize);$('#rows').innerHTML=slice.map(r=>`<tr><td><input type="checkbox" aria-label="Select ${r.id}" data-id="${r.id}" ${S.selected.includes(r.id)?'checked':''}></td><td class="id">${r.id}</td><td>${r.region}</td><td>${r.type}</td><td class="temp ${r.temperature>8?'hot':''}">${r.temperature==null?'—':r.temperature.toFixed(1)+' C'}</td><td><span class="status">${r.status}</span></td><td>${r.owner||'—'}</td><td>${r.followUp||'—'}</td></tr>`).join('');$('#pageInfo').textContent=`Page ${S.page+1} of ${pages} · ${f.length} results`;$('#sel').textContent=`${S.selected.length} selected`;$('#prev').disabled=S.page===0;$('#next').disabled=S.page>=pages-1;document.querySelectorAll('[data-id]').forEach(c=>c.onchange=e=>{if(e.target.checked)S.selected.push(e.target.dataset.id);else S.selected=S.selected.filter(x=>x!==e.target.dataset.id);S.selected=[...new Set(S.selected)];rec('toggle','Select '+e.target.dataset.id,e.target.checked);render()});document.documentElement.dataset.benchmarkReady='true'}
$('#filter').onclick=()=>{S.filters={region:$('#region').value,status:$('#status').value,type:$('#type').value,minTemperature:$('#temp').value===''?null:Number($('#temp').value)};S.page=0;rec('filter','Shipment queue',S.filters);render()};$('#clear').onclick=()=>{S.selected=[];rec('click','Clear selection',null);render()};$('#prev').onclick=()=>{S.page--;rec('paginate','Previous',S.page+1);render()};$('#next').onclick=()=>{S.page++;rec('paginate','Next',S.page+1);render()};
function drawer(on){$('#drawer').classList.toggle('open',on);$('#shade').classList.toggle('on',on)}$('#bulk').onclick=()=>{if(!S.selected.length)return;$('#reviewIds').innerHTML=S.selected.map(x=>`<span class="chip">${x}</span>`).join('');$('#reviewCount').textContent=S.selected.length+' shipments selected';drawer(true);rec('open','Bulk review',S.selected,'ok',true)};$('#cancel').onclick=()=>{drawer(false);rec('close','Bulk review',null)};
$('#apply').onclick=()=>{const exact=['NC-204','NC-219','NC-233'].every(x=>S.selected.includes(x))&&S.selected.length===3,values=$('#action').value==='Route to specialist'&&$('#specialist').value==='Inez Park'&&$('#date').value==='2026-07-29'&&$('#note').value==='Temperature excursion verified; preserve chain-of-custody.';if(!exact||!values){$('#error').textContent='Review selection and complete every scoped action field.';rec('click','Apply to selected',null,'blocked');return}S.selected.forEach(id=>Object.assign(records[id],{status:'Specialist review',owner:'Inez Park',followUp:'2026-07-29',note:$('#note').value}));S.applyCount++;S.selected=[];drawer(false);$('#success').className='success';$('#success').textContent='3 shipments routed to Inez Park';rec('click','Apply to selected',3,'committed',true);render()};render();rec('ready','Dispatch queue',null)
</script></body></html>
